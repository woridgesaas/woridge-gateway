  name: ms-audit-engine
  port: 80
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    methods:
    - GET
    - OPTIONS
    - CONNECT
    - TRACE
    name: audit-route
    path_handling: v0
    paths:
    - /api/v1/audits
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    tags:
    - default
  tags:
  - audit
  - exposed API
  write_timeout: 60000
- connect_timeout: 60000
  enabled: true
  host: host.docker.internal
  name: ms-authentification
  port: 5265
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: auth-route
    path_handling: v0
    paths:
    - /api
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  - https_redirect_status_code: 426
    methods:
    - POST
    name: login-route
    path_handling: v0
    paths:
    - /api/auth
    plugins:
    - config:
        day: null
        error_code: 429
        error_message: Too many attempts. Please try again later
        fault_tolerant: true
        header_name: null
        hide_client_headers: false
        hour: 10
        limit_by: ip
        minute: 3
        month: null
        path: null
        policy: local
        redis_database: 0
        redis_host: null
        redis_password: null
        redis_port: 6379
        redis_server_name: null
        redis_ssl: false
        redis_ssl_verify: false
        redis_timeout: 2000
        redis_username: null
        second: null
        sync_rate: -1
        year: null
      enabled: true
      name: rate-limiting
      protocols:
      - grpc
      - grpcs
      - http
      - https
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  - https_redirect_status_code: 426
    methods:
    - POST
    name: request-reset-password-route
    path_handling: v0
    paths:
    - /api/auth/request
    plugins:
    - config:
        day: null
        error_code: 429
        error_message: Too many attempts. Please try again later
        fault_tolerant: true
        header_name: null
        hide_client_headers: false
        hour: 5
        limit_by: ip
        minute: 2
        month: null
        path: null
        policy: local
        redis_database: 0
        redis_host: null
        redis_password: null
        redis_port: 6379
        redis_server_name: null
        redis_ssl: false
        redis_ssl_verify: false
        redis_timeout: 2000
        redis_username: null
        second: null
        sync_rate: -1
        year: null
      enabled: true
      name: rate-limiting
      protocols:
      - grpc
      - grpcs
      - http
      - https
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  - https_redirect_status_code: 426
    methods:
    - POST
    name: verify-otp-code-route
    path_handling: v0
    paths:
    - /api/auth/verify
    plugins:
    - config:
        day: null
        error_code: 429
        error_message: Too many attempts. Please try again later
        fault_tolerant: true
        header_name: null
        hide_client_headers: false
        hour: 6
        limit_by: ip
        minute: 3
        month: null
        path: null
        policy: local
        redis_database: 0
        redis_host: null
        redis_password: null
        redis_port: 6379
        redis_server_name: null
        redis_ssl: false
        redis_ssl_verify: false
        redis_timeout: 2000
        redis_username: null
        second: null
        sync_rate: -1
        year: null
      enabled: true
      name: rate-limiting
      protocols:
      - grpc
      - grpcs
      - http
      - https
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000
