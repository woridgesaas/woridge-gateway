_format_version: "3.0"
plugins:
- enabled: true
  name: authentication
  protocols:
  - grpc
  - grpcs
  - http
  - https
- enabled: true
  name: authorization
  protocols:
  - grpc
  - grpcs
  - http
  - https
- config:
    credentials: true
    exposed_headers:
    - Content-Disposition
    - X-Auth-Token
    headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Subdomain
    max_age: 3600
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
    origins:
    - http://localhost:4200
    - http://entreprise.woridge.com:4200
    preflight_continue: false
  enabled: true
  instance_name: Angular_Origin
  name: cors
  protocols:
  - http
  - https
  tags:
  - CORS
  - Angular
- enabled: true
  name: subscription
  protocols:
  - grpc
  - grpcs
  - http
  - https
- enabled: true
  name: tenant
  protocols:
  - grpc
  - grpcs
  - http
  - https
services:
- connect_timeout: 60000
  enabled: true
  host: host.docker.internal
  name: ms-administrative-documents
  port: 8085
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: documents-route
    path_handling: v0
    paths:
    - /api/documents
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000
- connect_timeout: 60000
  enabled: true
