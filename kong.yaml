_format_version: "3.0"
plugins:
  - name: tenant
  - name: subscription
  - name: authentication
  - name: authorization
  - name: cors
    instance_name: Angular_Origin
    enabled: true
    tags:
      - CORS
      - Angular
    config:
      origins:
        - http://localhost:4200
        - http://entreprise.woridge.com:4200
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Subdomain
      exposed_headers:
        - Content-Disposition
        - X-Auth-Token
      credentials: true
      preflight_continue: false
      max_age: 3600
    protocols:
      - http
      - https
services:
  - name: ms-authentification
    url: http://host.docker.internal:5265
    routes:
      - name: auth-route
        paths:
          - /api
        strip_path: false
      - name: login-route
        paths:
          - /api/auth
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              policy: local
              limit_by: ip
              error_code: 429
              error_message: "Too many attempts. Please try again later"
      - name: request-reset-password-route
        paths:
          - /api/auth/request
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 2
              hour: 5
              policy: local
              limit_by: ip
              error_code: 429
              error_message: "Too many attempts. Please try again later"
      - name: verify-otp-code-route
        paths:
          - /api/auth/verify
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 6
              policy: local
              limit_by: ip
              error_code: 429
              error_message: "Too many attempts. Please try again later"

